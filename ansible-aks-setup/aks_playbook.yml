---
- name: Create AKS Cluster using Azure CLI
  hosts: localhost
  connection: local
  gather_facts: no

- var:
    location: "eastus2"
    resource_group: "vipin-demo-resource-group"
    aks_resource_group: "vipin-aks-rg"
    cluster_name: "vipin-aks-cluster"
    node_count: 2
    vm_size: "Standard_DS2_v2"
    
  tasks:

    - name: Login to Azure
      shell: |
        az login --service-principal \
          -u "{{ lookup('env', 'AZ_CLIENT_ID') }}" \
          -p "{{ lookup('env', 'AZ_CLIENT_SECRET') }}" \
          --tenant "{{ lookup('env', 'AZ_TENANT_ID') }}"
        az account set --subscription "{{ lookup('env', 'AZ_SUBSCRIPTION_ID') }}"
      register: login_result

    - name: Check Azure login
      debug:
        var: login_result.stdout

    - name: Create resource group
      shell: |
        az group create --name "{{ aks_resource_group }}" --location "{{ location }}"
      register: rg_result

    - name: Check Resource Group creation
      debug:
        var: rg_result.stdout

    - name: Create AKS cluster
      shell: |
        az aks create \
          --name "{{ cluster_name }}" \
          --resource-group "{{ resource_group }}" \
          --dns-name-prefix "vipinaks" \
          --kubernetes-version "1.29.0" \
          --node-count "{{ node_count }}" \
          --node-vm-size "{{ vm_size }}" \
          --enable-rbac \
          --enable-managed-identity
      register: aks_result

    - name: Check AKS creation
      debug:
        var: aks_result.stdout

    - name: Get AKS credentials
      shell: |
        az aks get-credentials --resource-group "{{ resource_group }}" --name "{{ cluster_name }}" --overwrite-existing
      register: creds_result

    - name: Verify kubectl access
      shell: kubectl get nodes
      register: kubectl_result

    - name: Show cluster nodes
      debug:
        var: kubectl_result.stdout
