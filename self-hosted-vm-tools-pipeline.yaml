trigger: none

variables:
  org_url: "https://dev.azure.com/vadapavsamosa/user19"
  existing_agent: "vipin-agent-machine"

pool:
  name: 'vadapav'

# --------------------------------------------------------------------
# Stage 0 — Install Terraform once on RHEL agent
# --------------------------------------------------------------------
stages:
- stage: Setup_Terraform
  displayName: 'Stage 0: Install Terraform'
  jobs:
    - job: install_terraform
      displayName: 'Install Terraform 1.7.5'
      pool:
        name: 'vadapav'
        demands:
          - agent.name -equals $(existing_agent)
      steps:
        - script: |
            echo "=== Installing Terraform 1.7.5 on RHEL agent ==="
            sudo yum install -y unzip curl jq git || sudo dnf install -y unzip curl jq git

            echo "=== Installing Terraform manually (reliable) ==="
            curl -fL -o terraform_1.7.5_linux_amd64.zip https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
            unzip terraform_1.7.5_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            sudo chmod +x /usr/local/bin/terraform
            rm -f terraform_1.7.5_linux_amd64.zip
            terraform -v
          displayName: 'Install Terraform'

        - script: echo "##vso[task.setvariable variable=terraform_installed;isOutput=true]true"
          name: set_tf_flag

# --------------------------------------------------------------------
# Stage 1 — Create Ubuntu VM via Terraform
# --------------------------------------------------------------------
- stage: VM_Creation
  displayName: 'Stage 1: Create Ubuntu VM via Terraform'
  dependsOn: Setup_Terraform
  condition: succeeded('Setup_Terraform')
  jobs:
    - job: create_vm
      displayName: 'Terraform Apply for Ubuntu VM'
      pool:
        name: 'vadapav'
        demands:
          - agent.name -equals $(existing_agent)
      steps:
        - checkout: self

        - script: |
            echo "=== Installing prerequisites on RHEL agent ==="
            sudo yum install -y unzip curl git jq || sudo dnf install -y unzip curl git jq

            echo "=== Locating vm-setup folder dynamically ==="
            TERRAFORM_DIR=$(find "$(System.DefaultWorkingDirectory)" -type d -name "vm-setup" | head -n 1)
            if [ -z "$TERRAFORM_DIR" ]; then
              echo "❌ ERROR: vm-setup folder not found!"
              exit 1
            fi
            echo "✅ Found Terraform directory: $TERRAFORM_DIR"

            cd "$TERRAFORM_DIR" || exit 1
            terraform init
            terraform apply -auto-approve

            echo "=== Capturing VM public IP ==="
            VM_IP=$(terraform output -json public_ip_addresses | jq -r '.[0]')
            echo "✅ VM Public IP: $VM_IP"

            if [ -z "$VM_IP" ]; then
              echo "❌ ERROR: VM IP is empty. Exiting..."
              exit 1
            fi

            echo "##vso[task.setvariable variable=vm_public_ip;isOutput=true]$VM_IP"
          name: set_vm_ip
          displayName: 'Terraform Apply for Ubuntu VM'

# --------------------------------------------------------------------
# Stage 2 — Install DevOps Tools on Ubuntu VM
# --------------------------------------------------------------------
- stage: Install_Tools
  displayName: 'Stage 2: Install DevOps Tools on Ubuntu VM'
  dependsOn: VM_Creation
  condition: succeeded('VM_Creation')
  variables:
    vm_public_ip: $[ stageDependencies.VM_Creation.create_vm.outputs['set_vm_ip.vm_public_ip'] ]
  jobs:
    - job: install_tools
      displayName: 'Install DevOps Tools via Terraform (Ubuntu)'
      pool:
        name: 'vadapav'
        demands:
          - agent.name -equals $(existing_agent)
      steps:
        - checkout: self

        - script: |
            echo "=============================="
            echo "VM IP received from Stage 1: $(vm_public_ip)"
            echo "=============================="
          displayName: 'Debug — Verify VM IP'

        - script: |
            echo "=== Locating vm-tools folder dynamically ==="
            TOOLS_DIR=$(find "$(System.DefaultWorkingDirectory)" -type d -name "vm-tools" | head -n 1)
            if [ -z "$TOOLS_DIR" ]; then
              echo "❌ ERROR: vm-tools folder not found!"
              exit 1
            fi
            echo "✅ Found Tools directory: $TOOLS_DIR"

            cd "$TOOLS_DIR" || exit 1

            terraform init
            terraform validate
            terraform plan -var "vm_public_ip=$(vm_public_ip)" -out=tfplan
            terraform apply -auto-approve tfplan
          displayName: 'Terraform Apply for DevOps Tools (Ubuntu)'

# --------------------------------------------------------------------
# Stage 3 — Deploy AKS via Terraform + Ansible on Ubuntu VM
# --------------------------------------------------------------------
- stage: Create_AKS
  displayName: 'Stage 3: Deploy AKS via Terraform + Ansible'
  dependsOn: Install_Tools
  condition: succeeded('Install_Tools')
  variables:
    vm_public_ip: $[ stageDependencies.VM_Creation.create_vm.outputs['set_vm_ip.vm_public_ip'] ]
  jobs:
    - job: deploy_aks
      displayName: 'Deploy AKS via Terraform + Ansible (Ubuntu VM)'
      pool:
        name: 'vadapav'
        demands:
          - agent.name -equals $(existing_agent)
      steps:
        - checkout: self

        - script: |
            echo "=== Locating ansible-aks-setup Terraform folder dynamically ==="
            ANSIBLE_DIR=$(find "$(System.DefaultWorkingDirectory)" -type d -name "ansible-aks-setup" | head -n 1)
            if [ -z "$ANSIBLE_DIR" ]; then
                echo "❌ ERROR: ansible-aks-setup folder not found!"
                exit 1
            fi
            echo "✅ Found directory: $ANSIBLE_DIR"

            cd "$ANSIBLE_DIR" || exit 1

            echo "=== Initializing Terraform ==="
            terraform init

            echo "=== Validating Terraform configuration ==="
            terraform validate

            echo "=== Running Terraform apply to copy and execute Ansible scripts ==="
            terraform plan -var "vm_public_ip=$(vm_public_ip)" -out=tfplan
            terraform apply -auto-approve tfplan
          displayName: 'Terraform Apply for AKS via Ansible'
