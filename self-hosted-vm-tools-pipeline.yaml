trigger: none

variables:
  org_url: "https://dev.azure.com/vadapavsamosa/user19"
  agent_pool: "vadapav"
  agent_name: "vipin-agent-machine"
  ado_pat: "2hsB8h0MY96XhI4e9STeY2gwkVGGy8UDtoEDRIQzD5QzpmxABOxfJQQJ99BJACAAAAAp9R4wAAASAZDOmciV"

pool:
  name: 'vadapav'

stages:

# -------------------------------
# Stage 1 – Create VM
# -------------------------------
- stage: VM_Creation
  displayName: 'Stage 1: Create VM via Terraform'
  jobs:
  - job: create_vm
    displayName: 'Terraform Apply for VM'
    pool:
      name: 'vadapav'
      demands:
        - agent.name -equals vipin-agent-machine
    steps:
    - checkout: self
      path: vm-setup-azure-devops-tools

    - script: |
        echo "Updating and installing prerequisites on existing agent..."
        sudo apt-get update -y
        sudo apt-get install -y unzip curl

        echo "Installing Terraform..."
        curl -fLO https://releases.hashicorp.com/terraform/1.7.6/terraform_1.7.6_linux_amd64.zip
        unzip terraform_1.7.6_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform -v

        echo "Running Terraform to create VM..."
        cd $(Pipeline.Workspace)/s/vm-setup-azure-devops-tools/vm-setup
        terraform init
        terraform validate
        terraform apply -auto-approve

        # Capture VM public IP as output variable
        VM_IP=$(terraform output -raw public_ip_addresses)
        echo "VM Public IP: $VM_IP"
        echo "##vso[task.setvariable variable=VM_IP;isOutput=true]$VM_IP"
      displayName: 'Terraform Apply for VM'

# -------------------------------
# Stage 2 – Install Tools on new VM
# -------------------------------
- stage: Install_Tools
  displayName: 'Stage 2: Install DevOps Tools on Ubuntu VM'
  dependsOn: VM_Creation
  jobs:
  - job: install_tools
    displayName: 'Terraform Apply for DevOps Tools'
    pool:
      name: 'vadapav'   # No demands here; will SSH into new VM
    variables:
      VM_IP: $[ dependencies.VM_Creation.outputs['create_vm.VM_IP'] ]
    steps:
    - checkout: self
      path: vm-setup-azure-devops-tools

    - script: |
        echo "Installing DevOps Tools on VM $VM_IP via Terraform..."
        cd $(Pipeline.Workspace)/s/vm-setup-azure-devops-tools/vm-tools

        echo "Installing Terraform on new VM via remote-exec (if not installed by cloud-init)..."
        # terraform is installed via cloud-init, so this can be skipped if cloud-init succeeds

        terraform init
        terraform validate
        terraform plan -var "vm_public_ip=$VM_IP" -out=tfplan
        terraform apply -auto-approve tfplan
      displayName: 'Terraform Apply for DevOps Tools'
