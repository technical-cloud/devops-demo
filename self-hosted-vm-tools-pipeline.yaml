trigger: none

variables:
  org_url: "https://dev.azure.com/vadapavsamosa/user19"
  existing_agent: "vipin-agent-machine"

pool:
  name: 'vadapav'

stages:

# --------------------------------------------------------------------
# 🧱 Stage 1 — Create Ubuntu VM using Terraform
# --------------------------------------------------------------------
- stage: VM_Creation
  displayName: "Stage 1: Create Ubuntu VM via Terraform"
  jobs:
  - job: create_vm
    displayName: "Terraform Apply for VM"
    pool:
      name: 'vadapav'
      demands:
        - agent.name -equals $(existing_agent)

    steps:
    - checkout: self
      path: vm-setup-azure-devops-tools

    - script: |
        echo "=== Installing Terraform and creating VM ==="
        # Install prerequisites (RHEL + fallback for Ubuntu agents)
        sudo yum install -y yum-utils unzip curl git || sudo apt-get install -y unzip curl git

        # Install Terraform via official repo for RHEL / fallback for Ubuntu
        if command -v yum >/dev/null 2>&1; then
          sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo
          sudo yum -y install terraform
        else
          curl -fLO https://releases.hashicorp.com/terraform/1.7.6/terraform_1.7.6_linux_amd64.zip
          unzip terraform_1.7.6_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          rm terraform_1.7.6_linux_amd64.zip
        fi
        terraform -version

        echo "=== Running Terraform for VM provisioning ==="
        cd $(Pipeline.Workspace)/vm-setup-azure-devops-tools/vm-setup
        terraform init
        terraform apply -auto-approve

        VM_IP=$(terraform output -raw public_ip_addresses)
        echo "✅ VM Public IP: $VM_IP"

        # Export VM IP to next stage
        echo "##vso[task.setvariable variable=vm_public_ip;isOutput=true]$VM_IP"
      name: set_vm_ip
      displayName: "Terraform Apply for VM"

# --------------------------------------------------------------------
# 🧰 Stage 2 — Install DevOps Tools on new Ubuntu VM
# --------------------------------------------------------------------
- stage: Install_Tools
  displayName: "Stage 2: Install DevOps Tools on new VM"
  dependsOn: VM_Creation
  variables:
    vm_public_ip: $[ stageDependencies.VM_Creation.create_vm.outputs['set_vm_ip.vm_public_ip'] ]

  jobs:
  - job: install_tools
    displayName: "Install DevOps Tools via Terraform"
    pool:
      name: 'vadapav'

    steps:
    - checkout: self
      path: vm-setup-azure-devops-tools

    # Debug print to confirm the VM IP value
    - script: |
        echo "=============================="
        echo "VM IP received from Stage 1: $(vm_public_ip)"
        echo "=============================="
      displayName: "Debug — Verify VM IP"

    # Run Terraform to provision DevOps tools on new VM
    - script: |
        echo "=== Running Terraform for DevOps Tools installation ==="
        cd $(Pipeline.Workspace)/vm-setup-azure-devops-tools/vm-tools

        # Install Terraform if not present (on RHEL agent)
        if ! command -v terraform >/dev/null 2>&1; then
          echo "Terraform not found — installing via yum..."
          sudo yum install -y yum-utils
          sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo
          sudo yum -y install terraform
        fi
        terraform -version

        # Run Terraform plan/apply
        terraform init
        terraform validate
        terraform plan -var "vm_public_ip=$(vm_public_ip)" -out=tfplan
        terraform apply -auto-approve tfplan
      displayName: "Terraform Apply for DevOps Tools"
