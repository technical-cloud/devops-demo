- stage: Create_AKS
  displayName: 'Stage 3: Deploy AKS via Terraform + Ansible'
  dependsOn: Install_Tools
  condition: succeeded('Install_Tools')
  variables:
    vm_public_ip: $[ stageDependencies.VM_Creation.create_vm.outputs['set_vm_ip.vm_public_ip'] ]
  jobs:
    - job: deploy_aks
      displayName: 'Deploy AKS via Terraform + Ansible (Ubuntu VM)'
      pool:
        name: 'vadapav'
        demands:
          - agent.name -equals $(existing_agent)
      steps:
        - checkout: self

        - script: |
            echo "=== Locating ansible-aks-setup Terraform folder dynamically ==="
            ANSIBLE_DIR=$(find "$(System.DefaultWorkingDirectory)" -type d -name "ansible-aks-setup" | head -n 1)
            if [ -z "$ANSIBLE_DIR" ]; then
                echo "❌ ERROR: ansible-aks-setup folder not found!"
                exit 1
            fi
            echo "✅ Found directory: $ANSIBLE_DIR"

            cd "$ANSIBLE_DIR" || exit 1

            echo "=== Creating Azure env file on Ubuntu VM via Terraform ==="
            cat <<EOF > azure_env.sh
export AZ_SUBSCRIPTION_ID=${AZ_SUBSCRIPTION_ID}
export AZ_CLIENT_ID=${AZ_CLIENT_ID}
export AZ_CLIENT_SECRET=${AZ_CLIENT_SECRET}
export AZ_TENANT_ID=${AZ_TENANT_ID}
EOF
            chmod +x azure_env.sh

            echo "=== Initializing Terraform ==="
            terraform init

            echo "=== Validating Terraform configuration ==="
            terraform validate

            echo "=== Running Terraform plan and apply for AKS deployment via Ansible ==="
            terraform plan \
              -var "vm_public_ip=$(vm_public_ip)" \
              -var "vm_username=docker" \
              -var "vm_password=Docker@12345" \
              -out=tfplan
            terraform apply -auto-approve tfplan
          displayName: 'Terraform Apply for AKS via Ansible'
          env:
            AZ_SUBSCRIPTION_ID: $(subscription_id)
            AZ_CLIENT_ID: $(client_id)
            AZ_CLIENT_SECRET: $(client_secret)
            AZ_TENANT_ID: $(tenant_id)
