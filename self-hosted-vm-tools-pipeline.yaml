trigger: none

variables:
  org_url: "https://dev.azure.com/vadapavsamosa/user19"
  existing_agent: "vipin-agent-machine"
  ado_pat: "<YOUR_PERSONAL_ACCESS_TOKEN>"  # Use secure variable

pool:
  name: 'vadapav'

stages:

# -------------------------------
# Stage 1 – Create Ubuntu VM
# -------------------------------
- stage: VM_Creation
  displayName: 'Stage 1: Create Ubuntu VM via Terraform'
  jobs:
  - job: create_vm
    displayName: 'Terraform Apply for VM'
    pool:
      name: 'vadapav'
      demands:
        - agent.name -equals $(existing_agent)
    steps:
    - checkout: self
      path: vm-setup-azure-devops-tools

    - script: |
        echo "Installing prerequisites..."
        sudo apt-get update -y
        sudo apt-get install -y unzip curl

        echo "Installing Terraform..."
        curl -fLO https://releases.hashicorp.com/terraform/1.7.6/terraform_1.7.6_linux_amd64.zip
        unzip terraform_1.7.6_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform -v

        echo "Running Terraform to create VM..."
        cd $(Pipeline.Workspace)/vm-setup-azure-devops-tools/vm-setup
        terraform init
        terraform validate
        terraform apply -auto-approve

        # Capture VM public IP
        VM_IP=$(terraform output -raw public_ip_addresses)
        echo "VM Public IP: $VM_IP"
        echo "##vso[task.setvariable variable=vm_public_ip;isOutput=true]$VM_IP"
      displayName: 'Terraform Apply for VM'

# -------------------------------
# Stage 2 – Install DevOps Tools via remote-exec
# -------------------------------
- stage: Install_Tools
  displayName: 'Stage 2: Install DevOps Tools on New VM'
  dependsOn: VM_Creation
  jobs:
  - job: install_tools
    displayName: 'Install DevOps Tools on VM via Terraform'
    pool:
      name: 'vadapav'
      # Runs on existing agent, connects to new VM via SSH
    steps:
    - checkout: self
      path: vm-setup-azure-devops-tools

    - script: |
        echo "Running Terraform to install DevOps tools on new VM..."
        cd $(Pipeline.Workspace)/vm-setup-azure-devops-tools/vm-setup

        terraform init
        terraform validate

        echo "Planning Terraform apply for remote-exec..."
        terraform plan -out=tfplan

        echo "Applying Terraform plan to execute remote-exec on new VM..."
        terraform apply -auto-approve tfplan
      displayName: 'Terraform Apply for DevOps Tools'
