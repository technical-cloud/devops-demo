trigger: none

variables:
  org_url: "https://dev.azure.com/vadapavsamosa/user19"
  existing_agent: "vipin-agent-machine"

pool:
  name: 'vadapav'

stages:

# --------------------------------------------------------------------
# Stage 0 — Install Terraform once on the agent
# --------------------------------------------------------------------
- stage: Setup_Terraform
  displayName: 'Stage 0: Install Terraform'
  jobs:
    - job: install_terraform
      displayName: 'Install Terraform 1.7.5'
      pool:
        name: 'vadapav'
        demands:
          - agent.name -equals $(existing_agent)
      steps:
        - script: |
            echo "=== Installing prerequisites on RHEL agent ==="
            sudo yum install -y unzip curl git jq

            echo "=== Installing Terraform 1.7.5 from ZIP ==="
            curl -fL -o terraform_1.7.5_linux_amd64.zip https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
            unzip terraform_1.7.5_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            sudo chmod +x /usr/local/bin/terraform
            rm terraform_1.7.5_linux_amd64.zip
            terraform -v
          displayName: 'Install Terraform'

        - script: echo "##vso[task.setvariable variable=terraform_installed;isOutput=true]true"
          name: set_tf_flag

# --------------------------------------------------------------------
# Stage 1 — Create Ubuntu VM via Terraform
# --------------------------------------------------------------------
- stage: VM_Creation
  displayName: 'Stage 1: Create Ubuntu VM via Terraform'
  dependsOn: Setup_Terraform
  condition: succeeded('Setup_Terraform')
  jobs:
    - job: create_vm
      displayName: 'Terraform Apply for VM'
      pool:
        name: 'vadapav'
        demands:
          - agent.name -equals $(existing_agent)
      steps:
        - checkout: self
          path: vm-setup-azure-devops-tools

        - script: |
            echo "=== Running Terraform to create VM ==="
            cd $(Pipeline.Workspace)/vm-setup-azure-devops-tools/vm-setup || exit 1

            terraform init
            terraform apply -auto-approve

            # Capture VM public IP
            VM_IP=$(terraform output -json public_ip_addresses | jq -r '.[0]')
            echo "✅ VM Public IP: $VM_IP"

            if [ -z "$VM_IP" ]; then
              echo "❌ ERROR: VM IP is empty. Exiting..."
              exit 1
            fi

            # Export VM IP for next stage
            echo "##vso[task.setvariable variable=vm_public_ip;isOutput=true]$VM_IP"
          name: set_vm_ip
          displayName: 'Terraform Apply for VM'

# --------------------------------------------------------------------
# Stage 2 — Install DevOps Tools on the new VM
# --------------------------------------------------------------------
- stage: Install_Tools
  displayName: 'Stage 2: Install DevOps Tools on new VM'
  dependsOn: VM_Creation
  condition: succeeded('VM_Creation')
  variables:
    vm_public_ip: $[ stageDependencies.VM_Creation.create_vm.outputs['set_vm_ip.vm_public_ip'] ]

  jobs:
    - job: install_tools
      displayName: 'Install DevOps Tools via Terraform'
      pool:
        name: 'vadapav'
        demands:
          - agent.name -equals $(existing_agent)
      steps:
        - checkout: self
          path: vm-setup-azure-devops-tools

        - script: |
            echo "=============================="
            echo "VM IP received from Stage 1: '$(vm_public_ip)'"
            echo "=============================="

        - script: |
            echo "=== Running Terraform for DevOps Tools installation ==="
            cd $(Pipeline.Workspace)/vm-setup-azure-devops-tools/vm-tools || exit 1

            # Generate .tfvars dynamically
            echo "vm_public_ip = \"$(vm_public_ip)\"" > terraform.tfvars

            terraform init
            terraform validate
            terraform plan -var-file=terraform.tfvars -out=tfplan -input=false
            terraform apply -auto-approve tfplan
          displayName: 'Terraform Apply for DevOps Tools'

# --------------------------------------------------------------------
# Stage 3 — Deploy AKS Cluster via Ansible
# --------------------------------------------------------------------
- stage: Create_AKS
  displayName: 'Stage 3: Deploy AKS via Ansible'
  dependsOn: Install_Tools
  condition: succeeded('Install_Tools')
  variables:
    vm_public_ip: $[ stageDependencies.VM_Creation.create_vm.outputs['set_vm_ip.vm_public_ip'] ]

  jobs:
    - job: deploy_aks
      displayName: 'Deploy AKS via Ansible'
      pool:
        name: 'vadapav'
        demands:
          - agent.name -equals $(existing_agent)
      steps:
        - checkout: self
          path: vm-setup-azure-devops-tools

        - script: |
            echo "=== Preparing Azure credentials for Ansible on VM ==="

            # Debug workspace
            echo "Pipeline workspace: $(Pipeline.Workspace)/s"
            ls -l $(Pipeline.Workspace)/s

            # Go to Ansible directory
            cd $(Pipeline.Workspace)/s/vm-setup-azure-devops-tools/vm-ansible || exit 1
            echo "Current directory: $(pwd)"
            ls -l

            # Install Ansible if missing (RHEL agent)
            if ! command -v ansible-playbook >/dev/null 2>&1; then
              sudo yum install -y epel-release
              sudo yum install -y ansible python3-pip
            fi
            ansible --version

            # Write Azure credentials
            cat <<EOF > /home/docker/azure_env.sh
            export AZ_SUBSCRIPTION_ID=${AZ_SUBSCRIPTION_ID}
            export AZ_CLIENT_ID=${AZ_CLIENT_ID}
            export AZ_CLIENT_SECRET=${AZ_CLIENT_SECRET}
            export AZ_TENANT_ID=${AZ_TENANT_ID}
            EOF
            chmod +x /home/docker/azure_env.sh
            echo "✅ Azure credentials written to /home/docker/azure_env.sh"

            # Debug VM IP
            echo "VM IP for AKS playbook: '$(vm_public_ip)'"

            # Run Ansible playbook with Azure login
            source /home/docker/azure_env.sh
            ansible-playbook -i inventory.ini playbook.yml --extra-vars "vm_ip=$(vm_public_ip)"
          displayName: 'Run Ansible for AKS'
          env:
            AZ_SUBSCRIPTION_ID: $(AZ_SUBSCRIPTION_ID)
            AZ_CLIENT_ID: $(AZ_CLIENT_ID)
            AZ_CLIENT_SECRET: $(AZ_CLIENT_SECRET)
            AZ_TENANT_ID: $(AZ_TENANT_ID)
