stages:
- stage: CreateVM
  displayName: "Create VM Stage"

  jobs:
    - job: CreateVMOnExistingAgent
      displayName: "Create VM on Existing Agent"
      pool:
        name: "vadapav"
        demands:
          - Agent.Name -equals vipin-demo-agent-machine

      steps:

        - script: bash scripts/az-login.sh
          displayName: "Login to Azure"
          workingDirectory: $(Build.SourcesDirectory)
          env:
            azure_subscription_id: $(azure_subscription_id)
            azure_tenant_id: $(azure_tenant_id)
            azure_client_id: $(azure_client_id)
            azure_client_secret: $(azure_client_secret)

        - script: bash scripts/create-vm.sh
          displayName: "Create VM using Ansible"
          workingDirectory: $(Build.SourcesDirectory)
          env:
            RGNAME: $(rgname)
            REGION: $(region)

            VIRTUALNETWORK: $(virtualNetwork)
            SUBNETNAME: $(subnetName)
            VNETADDR: $(vnetaddr)
            SUBNETADDR: $(subnetAddr)

            VMNAME: $(vmName)
            VMSIZE: $(vmSize)
            VMIMAGE: $(vmImage)

            ADMINUSER: $(adminUser)
            ADMINPASSWORD: $(adminPassword)

            PUBLICIPNAME: $(publicIPName)
            NSGNAME: $(nsgName)
