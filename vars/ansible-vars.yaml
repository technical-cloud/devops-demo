variables:
  # -----------------------
  # Azure Resource Details
  # -----------------------
  region: "eastus2"                           # Azure region
  rgname: "vipin-resource-group"        # Resource Group name
  location: "eastus2"                         # Can be same as region

  # -----------------------
  # Virtual Network & Subnet
  # -----------------------
  virtualNetwork: "vipin-demo-vnet"          # VNet name
  subnetName: "vipin-demo-subnet"            # Subnet name
  vnetaddr: "10.1.0.0/16"                     # VNet address space
  subnetAddr: "10.1.1.0/24"                   # Subnet address prefix

  # -----------------------
  # VM Details
  # -----------------------
  vmName: "vipin-demo-vm"                     # Name of the VM
  vmSize: "Standard_B2s"                      # VM size
  vmImage: "Ubuntu2204"                       # VM image
  adminUser: "dockeruser"                         # VM admin username
  adminPassword: "Docker@12345"               # VM admin password (replace with secret in production)
  ansible_publicIP: true                       # Assign public IP (true/false)


  # -----------------------
  # Networking for VM
  # -----------------------
  nsgName: "vipin-demo-nsg"                  # Optional Network Security Group name
  publicIPName: "vipin-demo-pip"             # Optional Public IP name