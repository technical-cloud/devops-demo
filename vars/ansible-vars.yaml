variables:
  ansible.vmName: "demo-vm"
  ansible.vmSize: "Standard_B2s"
  ansible.vmImage: "Ubuntu2204"
  ansible.adminUser: "azureuser"
  ansible.sshKeyPath: "~/.ssh/id_rsa.pub"
  ansible.networkInterface: "demo-vm-nic"
  ansible.virtualNetwork: "demo-vnet" 
  ansible.subnetName: "demo-subnet"
  ansible.publicIP: "demo-vm-pip"
  ansible.securityGroup: "demo-vm-nsg"
  ansible.ansibleInventory: "inventory.ini"
  ansible.playbookPath: "ansible/create-vm-playbook.yml"
  